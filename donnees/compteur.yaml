
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compteur
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            role: client-redis
        spec:
          restartPolicy: Never
          containers:
            - name: compteur
              image: redis:7.4-alpine
              command:
                - sh
                - -c
                - |
                  for i in 1 2 3 4 5; do
                    redis-cli -h redis-0.redis INCR passages && exit 0
                    sleep 3
                  done
                  exit 1