apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoriser-compteur-vers-redis
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: client-redis
      ports:
        - port: 6379
